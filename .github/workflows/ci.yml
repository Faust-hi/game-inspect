name: CI

# Проверки, которые должны проходить перед попаданием изменений в основную ветвь:
# тесты backend, миграции, типы и тесты frontend, производственная сборка.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux-startup:
    name: Linux quick start
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shell syntax
        run: |
          for script in start.sh backend/run.sh frontend/run.sh; do
            bash -n "$script"
          done
      - name: Install, start both services and stop with Ctrl+C
        run: python tools/smoke_linux_launcher.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Тесты
        run: python -m pytest -q

      - name: Научная сверка (метрика, пропуски, разделение выборок)
        run: python -m pytest ../validation/test_evaluate.py -q

      - name: Миграции создают схему, соответствующую моделям
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
