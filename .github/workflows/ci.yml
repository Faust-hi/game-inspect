name: CI

# На каждом push и PR: проверка типов, тесты frontend, production-сборка,
# обязательные тесты backend и миграции.
#
# Вручную (workflow_dispatch) дополнительно: полный набор backend
# (critical + extended), браузерный сценарий Playwright и Linux smoke-проверка.
# Расписаний и автоматического запуска перед выпуском нет.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux-startup:
    name: Linux quick start
    # Долгий подъём двух сервисов — только по ручному запросу.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shell syntax
        run: |
          for script in start.sh backend/run.sh frontend/run.sh; do
            bash -n "$script"
          done
      - name: Install, start both services and stop with Ctrl+C
        run: python tools/smoke_linux_launcher.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      # Сборка нужна backend: часть обязательных проверок раздаёт статику
      # и без dist пропускалась бы.
      - name: Сохранить сборку для backend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend:
    name: Backend
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Получить сборку frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Обязательные тесты
        run: python -m pytest -q

      - name: Миграции создают схему, соответствующую моделям
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

  extended:
    name: Extended (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Получить сборку frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Установка зависимостей backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Полный набор backend
        working-directory: backend
        run: python -m pytest -m "critical or extended" -q

      - name: Установка зависимостей frontend
        working-directory: frontend
        run: npm ci

      - name: Браузеры Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Браузерный сценарий
        working-directory: frontend
        run: npm run test:e2e
