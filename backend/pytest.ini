[pytest]
testpaths = tests
markers =
    critical: обязательные проверки, идут по умолчанию и на каждом PR
    extended: подробные проверки, запускаются только вручную (-m "critical or extended")

# Обычный запуск (`python -m pytest`) выполняет только критические сценарии.
# Полный сохранённый набор: `python -m pytest -m "critical or extended"`.
# Параметр -m в командной строке указывается позже addopts, поэтому
# переопределяет его, а не дополняет.
addopts = -m critical
