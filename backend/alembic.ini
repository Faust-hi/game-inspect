; Настройки Alembic.
;
; Адрес базы задаётся не здесь, а переменной окружения DATABASE_URL той же,
; которую читает приложение: иначе миграции и приложение могут разойтись.
; Для SQLite путь по умолчанию — backend/gamedev_dss.db.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Шаблон имени файла ревизии: порядок по дате и номеру.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

; Кодировка файлов ревизий.
; timezone =
; truncate_slug_length = 40

[post_write_hooks]
; hooks = ruff
; ruff.type = console_scripts
; ruff.entrypoint = ruff
; ruff.options = format REVISION_SCRIPT_FILENAME

; Журнал: отдельный файл, чтобы не смешиваться с журналом приложения.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
